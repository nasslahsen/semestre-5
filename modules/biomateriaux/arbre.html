<!doctype html>
<html lang="fr" data-module="biomateriaux">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<title>Arbre du module · Biomatériaux, biomécanique et prothèses</title>
<link rel="stylesheet" href="../../commun/css/barre.css">
<link rel="stylesheet" href="../../commun/css/arbre.css">
<script src="../../registre.js"></script>
<script src="../../commun/js/plateforme.js"></script>
<script src="module.js"></script>
</head>
<body class="page-arbre">
<header id="barre"></header>
<div class="arbre-dessin"><svg id="arbre" viewBox="0 0 1120 640" role="img" aria-label="Arbre du module : parties, chapitres et notions"></svg></div>
<div class="arbre-bande"><p class="txt" id="txt" aria-live="polite"></p><a class="btn-ouvrir" id="ouvrir" hidden>Ouvrir</a></div>
<script src="../../commun/js/arbre.js"></script>
<script>
(function () {
  var P = PLATEFORME, MID = "biomateriaux";
  var sm = new URLSearchParams(location.search).get("sm") || "biomateriaux";
  P.barre(document.getElementById("barre"), { carte: P.urlPlan(MID, sm), droite: '<a class="site-retour" href="chapitres/chapitre-13.html">Vue d\'ensemble</a>' });
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  var txt = document.getElementById("txt"), ouvrir = document.getElementById("ouvrir");
  ARBRE.dessiner(document.getElementById("arbre"), { mid: MID, sm: sm, base: "", largeur: 1120, hauteur: 640, surChoix: function (i) {
    txt.innerHTML = "<b>" + esc(i.titre) + "</b>" + esc(i.texte);
    if (i.url) { ouvrir.hidden = false; ouvrir.href = i.url; ouvrir.textContent = i.libelle; } else ouvrir.hidden = true;
  } });
})();
</script>
</body>
</html>
